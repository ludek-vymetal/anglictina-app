<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angličtina z mého bytu</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --ink:#f2f4f8; --mute:#9aa3b2;
    --accent:#2f6bff; --accent2:#ffc400; --good:#33c27a; --warn:#ff9f1a; --bad:#ff5a5a; --blue:#55b6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  header{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
  header h1{font-size:22px;margin:0;flex:1}
  .back{background:none;border:0;font-size:24px;padding:4px 8px;margin-left:-8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
  .stat b{display:block;font-size:28px;line-height:1.1}
  .stat span{font-size:12px;color:var(--mute)}
  h2{font-size:22px;margin:0 0 6px}
  p.mute,.mute{color:var(--mute)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:0;background:var(--accent);font-size:18px;font-weight:650;margin-top:12px}
  .btn:disabled{opacity:.4}
  .btn.ghost{background:transparent;border:1.5px solid var(--line)}
  .btn.small{min-height:44px;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .room{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0}
  .room img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
  .room div{padding:10px 12px;font-weight:600}
  .room small{display:block;color:var(--mute);font-weight:400}
  .photo{position:relative;width:100%;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  .photo img{display:block;width:100%;pointer-events:none}
  .label{position:absolute;transform:translate(-50%,-50%);background:rgba(30,94,255,.9);border:1px solid #fff;border-radius:14px;padding:2px 7px;font-weight:700;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);touch-action:none}
  .label.dragging{background:var(--accent2);color:#111;font-size:15px;padding:4px 10px;z-index:2}
  .dot{position:absolute;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.4)}
  .photo{margin:0 auto}
  .marker{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,196,0,.85);border:3px solid #fff;animation:pulse .9s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:translate(-50%,-50%) scale(.8)}to{transform:translate(-50%,-50%) scale(1.25)}}
  .hint{font-size:13px;color:var(--mute);text-align:center;margin:8px 0 0}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .grade{min-height:54px;border-radius:12px;background:transparent;font-weight:650;border:1.5px solid}
  .g0{color:var(--bad);border-color:var(--bad)} .g1{color:var(--warn);border-color:var(--warn)}
  .g2{color:var(--good);border-color:var(--good)} .g3{color:var(--blue);border-color:var(--blue)}
  .answer{font-size:28px;font-weight:800;margin:10px 0 0;display:flex;align-items:center;gap:10px}
  .icon{background:var(--card);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .sent{font-style:italic;margin-top:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 20px 28px;max-height:90vh;overflow:auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .chip{background:transparent;border:1.5px solid var(--line);border-radius:20px;padding:8px 14px}
  input[type=text]{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font-size:16px;margin-top:8px}
  label.field{display:block;margin-top:10px;font-size:13px;color:var(--mute)}
  .busy{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;text-align:center;padding:24px}
  .spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:24px}
  .err{color:var(--bad)}
  .toggle{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px}
  .tray{min-height:64px;border:1.5px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px;align-items:center}
  .tray.ok{border-color:var(--good);border-style:solid} .tray.bad{border-color:var(--bad);border-style:solid}
  .pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:17px;font-weight:600}
  .tray .tile{background:rgba(47,107,255,.18);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">Načítám…</p></div>
<div id="layer"></div>

<script>
// ---------- stav ----------
const S = {
  db:null, sample:null, uid:null, canImages:false,
  rooms:[], meta:{}, loaded:false, loadErr:'',
  view:'today', roomId:null, hide:false, revealed:null, addMode:false,
  queue:[], qDone:0, phase:'ask'
};
const NEW_PER_DAY = 15;
const $app = document.getElementById('app');
const $layer = document.getElementById('layer');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const yesterday = () => { const d=new Date(Date.now()-864e5); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ---------- hlas ----------
// iPhone (Safari) má u hlasu několik chyb: první řeč musí zaznít přímo z ťuknutí,
// "cancel" těsně před "speak" ji umlčí a některé anglické hlasy jsou jen efektové (Bells, Bad News…).
const NICE_VOICES = ['Samantha','Alex','Ava','Allison','Susan','Tom','Karen','Daniel','Moira','Google US English','Microsoft Aria','Microsoft Jenny'];
let voiceCache = null;
function pickVoice(){
  if (voiceCache) return voiceCache;
  let vs = [];
  try{ vs = speechSynthesis.getVoices() || []; }catch(e){}
  const en = vs.filter(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith('en'));
  for (const n of NICE_VOICES){ const v = en.find(v => v.name && v.name.indexOf(n) === 0); if (v) return (voiceCache = v); }
  return null;   // radši žádný konkrétní hlas: systém vybere výchozí anglický podle jazyka
}
try{ speechSynthesis.onvoiceschanged = () => { voiceCache = null; }; }catch(e){}
let ttsUnlocked = false;
document.addEventListener('pointerdown', () => {
  if (ttsUnlocked) return; ttsUnlocked = true;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
}, true);

function speakList(list, slow){
  let synth; try{ synth = window.speechSynthesis; }catch(e){}
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined'){ toast('Tenhle prohlížeč neumí přehrát výslovnost.'); return; }
  const go = () => {
    try{
      synth.resume();
      const v = pickVoice();
      for (const t of list){
        if (!t) continue;
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'en-US'; u.rate = slow ? 0.6 : 0.9; u.volume = 1;
        if (v) u.voice = v;
        synth.speak(u);
      }
    }catch(e){}
  };
  if (synth.speaking || synth.pending){ synth.cancel(); setTimeout(go, 120); }
  else go();
}
function say(text, slow){ speakList([text], slow); }
function sayMany(list){ speakList(list); }

// ---------- zápisy: jeden zápis na dokument najednou ----------
const chains = {};
function save(docId, data){
  if (!S.db || !S.uid) return Promise.resolve();
  const ref = S.db.collection('data/users/' + S.uid).doc(docId);
  const run = () => ref.set(data).catch(e => {
    toast(e && e.code === 'quota_exceeded' ? 'Úložiště je plné, smaž nějakou místnost.' : 'Uložení se nepovedlo, zkus to znovu.');
  });
  chains[docId] = (chains[docId] || Promise.resolve()).then(run);
  return chains[docId];
}
function remove(docId){
  if (!S.db || !S.uid) return;
  S.db.collection('data/users/' + S.uid).doc(docId).delete().catch(()=>{});
}
function saveRoom(r){ const {id, ...body} = r; return save(id, body); }
function saveMeta(){ return save('meta', {...S.meta}); }

// ---------- opakování v rozestupech (zjednodušené SM-2) ----------
function applyGrade(w, g){
  const now = Date.now();
  w.ease = w.ease || 2.5; w.interval = w.interval || 0; w.reps = w.reps || 0; w.lapses = w.lapses || 0;
  if (g === 0){
    w.lapses++; w.reps = 0; w.interval = 0;
    w.ease = Math.max(1.3, w.ease - 0.2);
    w.due = now + 10*60*1000; return;
  }
  if (g === 1){ w.interval = w.reps === 0 ? 1 : Math.min(365, Math.max(1, w.interval*1.2)); w.ease = Math.max(1.3, w.ease-0.15); }
  if (g === 2){ w.interval = w.reps === 0 ? 1 : w.reps === 1 ? 3 : Math.min(365, w.interval*w.ease); }
  if (g === 3){ w.interval = w.reps === 0 ? 3 : Math.min(365, w.interval*w.ease*1.3); w.ease = Math.min(3, w.ease+0.15); }
  w.reps++;
  w.due = now + Math.round(w.interval*24*60)*60*1000;
}
const isNew = w => !w.reps && !w.lapses;

function newLeft(){
  const n = S.meta.newDate === today() ? (S.meta.newCount || 0) : 0;
  return Math.max(0, NEW_PER_DAY - n);
}
function streak(){
  const d = S.meta.streakDate;
  return (d === today() || d === yesterday()) ? (S.meta.streak || 0) : 0;
}
const items = r => [...(r.words || []), ...(r.phrases || []), ...(r.idioms || [])];
function stats(){
  const now = Date.now(); let total=0, learned=0, due=0;
  for (const r of S.rooms) for (const w of items(r)){
    total++; if ((w.interval||0) >= 7) learned++;
    if (!isNew(w) && (w.due||0) <= now) due++;
  }
  const next = nextLessonRoom();
  return {total, learned, due, streak: streak(), next, rooms: S.rooms.length};
}
// opakování: jen to, co už prošlo lekcí a je na řadě (nová slova přicházejí v lekcích)
function buildQueue(roomId){
  const now = Date.now(), due = [], fresh = [];
  for (const r of S.rooms){
    if (roomId && r.id !== roomId) continue;
    for (const w of items(r)){
      if (isNew(w)){ if (roomId) fresh.push({r:r.id, w:w.id}); }
      else if ((w.due||0) <= now) due.push({r:r.id, w:w.id, due:w.due||0});
    }
  }
  due.sort((a,b) => a.due - b.due);
  return [...due, ...fresh];
}
const findRoom = id => S.rooms.find(r => r.id === id);
const findWord = (rId, wId) => { const r = findRoom(rId); return r ? items(r).find(w => w.id === wId) : null; };
const nextLessonRoom = () => S.rooms.slice().sort((a,b)=>a.created-b.created).find(r => !r.done && r.words.length);

// ---------- obrázky ----------
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => res(img); img.onerror = () => rej(new Error('Fotku se nepodařilo načíst.'));
    img.src = url;
  });
}
function scaled(img, max, q, asBlob){
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  if (asBlob) return new Promise(r => c.toBlob(r, 'image/jpeg', q));
  return {data: c.toDataURL('image/jpeg', q), w: c.width, h: c.height};
}

// ---------- AI: štítky na fotce ----------
function promptFor(roomName){
  return `Jsi lektor angličtiny pro Čecha (začátečník). Na fotce je místo z jeho běžného dne: "${roomName}".
Najdi 8–15 dobře viditelných předmětů, které se hodí naučit (běžné věci, ne značky).
Ke každému vrať objekt:
- "en": anglický název bez členu (např. "kettle", "cutting board")
- "cs": český překlad
- "pron": výslovnost přepsaná česky, jak by ji četl Čech (např. "ketl", "katyng bórd")
- "x", "y": střed předmětu na fotce jako číslo 0–1 (0,0 = levý horní roh)
- "sentence_en": krátká věta (max 8 slov) o činnosti s tím předmětem, 1. osoba, přítomný čas
- "sentence_cs": její český překlad
Odpověz pouze JSON polem, např. [{"en":"kettle","cs":"konvice","pron":"ketl","x":0.4,"y":0.55,"sentence_en":"I'm boiling water in the kettle.","sentence_cs":"Vařím vodu v konvici."}]`;
}
const SAMPLE_ERR = {
  not_granted:'Appka nemá povolení používat Clauda. Povol ho v dialogu a zkus to znovu.',
  rate_limited:'Teď je toho moc najednou, zkus to za chvíli.',
  session_expired:'Přihlas se znovu na claude.ai.',
  image_rejected:'Tuhle fotku nejde použít, zkus jinou.',
  images_unavailable:'Tady nejde posílat fotky Claudovi.',
  invalid_json:'Claude odpověděl nečekaně, zkus to znovu.',
  refused:'Claude tuhle fotku odmítl, zkus jinou.'
};

async function addRoom(name, file){
  busy('Hledám věci na fotce…<br><span class="mute">trvá to zhruba 10–40 sekund</span>');
  try{
    const img = await loadImage(file);
    const small = scaled(img, 900, 0.72);
    const aiBlob = await scaled(img, 1400, 0.85, true);
    let list = [];
    try{
      list = await S.sample.json(promptFor(name), {images:[aiBlob]});
    }catch(e){
      throw new Error(SAMPLE_ERR[e && e.code] || 'Rozpoznání se nepovedlo, zkus to znovu.');
    }
    if (!Array.isArray(list)) list = [];
    const n01 = v => { const x = Number(v); return isFinite(x) ? Math.min(1, Math.max(0, x)) : 0.5; };
    const words = list.filter(o => o && o.en).slice(0, 20).map(o => ({
      id: rid('w'), en: String(o.en).trim(), cs: String(o.cs||'').trim(), pron: String(o.pron||'').trim(),
      x: n01(o.x), y: n01(o.y), sen: String(o.sentence_en||'').trim(), scs: String(o.sentence_cs||'').trim(),
      due:0, interval:0, ease:2.5, reps:0, lapses:0
    }));
    const room = {id: rid('room-'), name, img: small.data, w: small.w, h: small.h, created: Date.now(), words};
    S.rooms.push(room);
    await saveRoom(room);
    S.view = 'room'; S.roomId = room.id; S.hide = false;
    unbusy(); render();
    if (!words.length) toast('Na fotce jsem nic nenašel. Přidej slova ručně tlačítkem + Slovo.');
  }catch(e){
    unbusy(); toast(e.message || 'Něco se nepovedlo.');
  }
}

// ---------- pomocné UI ----------
function busy(html){ $layer.innerHTML = `<div class="busy"><div class="spin"></div><div>${html}</div></div>`; }
function unbusy(){ $layer.innerHTML = ''; }
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:16px;right:16px;bottom:20px;max-width:528px;margin:auto;background:#2a2f3a;padding:14px 16px;border-radius:12px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.5)';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block';
  toastT = setTimeout(() => t.style.display='none', 4500);
}
function sheet(html){ $layer.innerHTML = `<div class="modal" id="modal"><div class="sheet">${html}</div></div>`;
  document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSheet(); }); }
function closeSheet(){ $layer.innerHTML=''; }
function go(view, extra){ Object.assign(S, {view}, extra||{}); speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel(); render(); window.scrollTo(0,0); }

// fotka nesmí zabrat celou obrazovku: výšku omezíme a šířku dopočítáme podle poměru stran
const pstyle = (r, vh) => `style="aspect-ratio:${r.w}/${r.h};max-width:calc(${vh}vh * ${(r.w/r.h).toFixed(4)})"`;
// rozhrne štítky, které se překrývají (posune je kousek nahoru/dolů)
function declutter(photo){
  const ls = [...photo.querySelectorAll('.label')]; if (ls.length < 2) return;
  ls.forEach(l => { l.style.marginTop = '0px'; l.style.marginLeft = '0px'; });
  const H = photo.clientHeight, p0 = photo.getBoundingClientRect();
  ls.forEach(l => { const r = l.getBoundingClientRect();
    if (r.left < p0.left) l.style.marginLeft = (p0.left - r.left + 2) + 'px';
    if (r.right > p0.right) l.style.marginLeft = (p0.right - r.right - 2) + 'px'; });
  for (let it = 0; it < 8; it++){
    let moved = false;
    const rs = ls.map(l => l.getBoundingClientRect());
    for (let i = 0; i < ls.length; i++) for (let j = i + 1; j < ls.length; j++){
      const a = rs[i], b = rs[j];
      const ox = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      const oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      if (ox > 2 && oy > 0){
        const lower = a.top <= b.top ? j : i, upper = lower === j ? i : j;
        const shift = oy / 2 + 2;
        ls[lower].style.marginTop = (parseFloat(ls[lower].style.marginTop) + shift) + 'px';
        ls[upper].style.marginTop = (parseFloat(ls[upper].style.marginTop) - shift) + 'px';
        moved = true;
      }
    }
    if (!moved) break;
  }
  // nic nesmí utéct mimo fotku
  const pr = photo.getBoundingClientRect();
  ls.forEach(l => { const r = l.getBoundingClientRect();
    if (r.top < pr.top) l.style.marginTop = (parseFloat(l.style.marginTop) + pr.top - r.top + 1) + 'px';
    if (r.bottom > pr.top + H) l.style.marginTop = (parseFloat(l.style.marginTop) - (r.bottom - pr.top - H) - 1) + 'px';
    if (r.left < pr.left) l.style.marginLeft = (pr.left - r.left + 2) + 'px';
    if (r.right > pr.right) l.style.marginLeft = (pr.right - r.right - 2) + 'px'; });
}
new MutationObserver(() => requestAnimationFrame(() => document.querySelectorAll('.photo').forEach(declutter)))
  .observe(document.getElementById('app'), {childList:true, subtree:true});

// ---------- obrazovky ----------
function render(){
  if (!S.loaded){
    $app.innerHTML = S.loadErr ? `<h2>Nejde to načíst</h2><p class="mute">${esc(S.loadErr)}</p>` : '<p class="mute">Načítám tvoje místnosti…</p>';
    return;
  }
  if (S.view === 'rooms') return renderRooms();
  if (S.view === 'room') return renderRoom();
  if (S.view === 'review') return renderReview();
  if (S.view === 'lesson') return renderLesson();
  renderToday();
}

function renderToday(){
  const s = stats();
  let body;
  if (!s.rooms){
    body = `<h2>Začni první fotkou</h2>
      <p class="mute">Vyfoť kuchyň. Appka na fotce najde věci a napíše k nim anglické názvy, výslovnost a větu.</p>
      <button class="btn" data-act="newroom">📷 Vyfotit první místnost</button>`;
  } else {
    body = (s.next
      ? `<h2>Další lekce: ${esc(s.next.name)}</h2>
         <p class="mute">${s.next.words.length} slov · pokoj → slova ve větách → test v pokoji → skládání vět → 3 fráze. Zhruba 20 minut.</p>
         <button class="btn" data-act="lesson">▶ Začít lekci</button>`
      : `<h2>Všechny pokoje máš prošlé</h2>
         <p class="mute">Vyfoť další místo (koupelnu, auto, fitko…) a appka z něj udělá novou lekci.</p>
         <button class="btn" data-act="newroom">📷 Přidat další místnost</button>`)
      + `<button class="btn ghost" data-act="review" ${s.due ? '' : 'disabled'}>🔁 Opakování${s.due ? ' · ' + s.due + ' na řadě' : ' · nic na řadě'}</button>
         <button class="btn ghost" data-act="rooms">🏠 Moje místnosti</button>`;
  }

function wirePhoto(r){
  const photo = document.getElementById('photo');
  let drag = null;
  photo.addEventListener('pointerdown', e => {
    const el = e.target.closest('.label');
    if (!el) return;
    drag = {el, w: r.words.find(w => w.id === el.dataset.wid), x0:e.clientX, y0:e.clientY, moved:false};
    el.style.marginTop = '0px'; el.style.marginLeft = '0px';
    el.setPointerCapture(e.pointerId);
  });
  photo.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx,dy) < 8) return;
    drag.moved = true; drag.el.classList.add('dragging');
    const b = photo.getBoundingClientRect();
    drag.w.x = Math.min(1, Math.max(0, (e.clientX - b.left)/b.width));
    drag.w.y = Math.min(1, Math.max(0, (e.clientY - b.top)/b.height));
    drag.el.style.left = drag.w.x*100 + '%'; drag.el.style.top = drag.w.y*100 + '%';
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null; d.el.classList.remove('dragging');
    if (d.moved){ saveRoom(r); return; }
    if (S.hide && S.revealed !== d.w.id){ S.revealed = d.w.id; say(d.w.en); renderRoom(); }
    else wordSheet(r, d.w);
  };
  photo.addEventListener('pointerup', end);
  photo.addEventListener('pointercancel', () => { if (drag){ drag.el.classList.remove('dragging'); drag = null; } });
  photo.addEventListener('click', e => {
    if (!S.addMode || e.target.closest('.label')) return;
    const b = photo.getBoundingClientRect();
    S.addMode = false;
    editSheet(r, null, (e.clientX-b.left)/b.width, (e.clientY-b.top)/b.height);
  });
}

function grade(g){
  const item = S.queue[0]; if (!item) return;
  const r = findRoom(item.r), w = findWord(item.r, item.w);
  if (!r || !w){ S.queue.shift(); return renderReview(); }
  const wasNew = isNew(w);
  applyGrade(w, g);
  saveRoom(r);
  const t = today();
  if (wasNew){
    S.meta.newCount = (S.meta.newDate === t ? (S.meta.newCount||0) : 0) + 1;
    S.meta.newDate = t;
  }
  if (S.meta.streakDate !== t){
    S.meta.streak = streak() + 1; S.meta.streakDate = t;
  }
  saveMeta();
  S.queue.shift();
  if (g === 0) S.queue.splice(Math.min(3, S.queue.length), 0, item);
  else S.qDone++;
  S.phase = 'ask';
  renderReview(); window.scrollTo(0,0);
}

// ---------- LEKCE: pokoj → doplň do věty → test v pokoji → skládání vět → fráze dne → další pokoj ----------

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const STEPS = [['intro','Pokoj'],['cards','Do věty'],['test','Test'],['tiles','Skládání'],['idioms','Fráze']];

function startLesson(roomId){
  const r = findRoom(roomId); if (!r || !r.words.length) return;
  L = {roomId, stage:'intro', kind:'words', list: r.words.map(w => w.id), i:0, rep:0, errors:{}, oldGraded:{}, passed:{}};
  go('lesson');
}
function lessonRoom(){ return L && findRoom(L.roomId); }
function cur(){ const r = lessonRoom(); return r && L.list ? findWord(r.id, L.list[L.i]) : null; }
const isPhraseLike = (rId, w) => { const r = findRoom(rId); return !!r && ([...(r.phrases||[]), ...(r.idioms||[])].some(p => p.id === w.id)); };

// Najde slovo ve větě a nahradí ho mezerou: "I'm boiling water in the ____."
function gap(w){
  if (!w.sen || !w.en) return null;
  const re = new RegExp('\\b' + w.en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(s|es)?\\b', 'i');
  const m = w.sen.match(re); if (!m) return null;
  return {before: w.sen.slice(0, m.index), word: m[0], after: w.sen.slice(m.index + m[0].length)};
}

function startCards(ids, after, withOld, rId){
  const r = lessonRoom();
  let deck = ids.map(id => ({r: rId || r.id, w: id}));
  if (withOld){
    // nenápadně přimícháme pár kartiček z minulých lekcí, které jsou na řadě
    const old = buildQueue(null).filter(it => it.r !== r.id).slice(0, 4).map(it => ({r: it.r, w: it.w, old: true}));
    deck = shuffle([...deck, ...old]);
  } else deck = shuffle(deck);
  Object.assign(L, {stage:'cards', deck, di:0, round:1, roundErr:[], flipped:false, after});
}
function startTest(ids){ Object.assign(L, {stage:'test', list: ids, i:0, shown:false, testErr:[]}); }

// ---- skládání vět z kostiček ----
const tokens = s => s.replace(/[.!?…]+$/,'').split(/\s+/).filter(Boolean);
function startTiles(ids){
  Object.assign(L, {stage:'tiles', kind:'phrases', tdeck: shuffle(ids), ti:0, tround:1, terr:[]});
  prepTile();
}
function prepTile(){
  const r = lessonRoom(); const p = findWord(r.id, L.tdeck[L.ti]); if (!p) return;
  const t = tokens(p.en); let pool = shuffle(t.map((x, i) => ({x, i})));
  if (t.length > 1 && pool.every((o, k) => o.x === t[k])) pool = pool.reverse();
  Object.assign(L, {pool, picked:[], checked:null});
}

async function ensurePhrases(){
  const r = lessonRoom();
  if (r.phrases && r.phrases.length) return true;
  if (!S.sample) return false;
  busy('Připravuju věty k pokoji…<br><span class="mute">co tady běžně děláš: „musím pověsit záclony…“</span>');
  try{
    const words = r.words.map(w => w.en + ' (' + w.cs + ')').join(', ');
    const list = await S.sample.json(
`Jsi lektor angličtiny pro Čecha, úroveň začátečník (A1–A2). Místnost: "${r.name}". Slova, která se právě naučil: ${words}.
Napiš 8 krátkých vět (4–8 slov) o tom, co v té místnosti běžně dělá nebo musí udělat, v 1. osobě. Střídej vazby "I have to…", "I need to…", "I'm going to…", "I usually…", "Can you…?". Každá věta ať používá jedno z naučených slov (např. "I have to hang the curtains.").
Ke každé vrať objekt {"en": anglicky, "cs": přirozeně česky, "pron": výslovnost přepsaná česky}. Odpověz pouze JSON polem.`);
    r.phrases = (Array.isArray(list) ? list : []).filter(o => o && o.en).slice(0, 10).map(o => ({
      id: rid('p'), en: String(o.en).trim(), cs: String(o.cs||'').trim(), pron: String(o.pron||'').trim(),
      due:0, interval:0, ease:2.5, reps:0, lapses:0
    }));
    await saveRoom(r);
  }catch(e){
    unbusy(); toast(SAMPLE_ERR[e && e.code] || 'Věty se nepodařilo připravit.'); return false;
  }
  unbusy();
  return r.phrases.length > 0;
}

function startIdioms(){
  const r = lessonRoom();
  if (!r.idioms || !r.idioms.length){
    // kolik frází už je rozdaných v ostatních pokojích
    const used = new Set(S.rooms.flatMap(x => (x.idioms||[]).map(i => i.en)));
    const fresh = IDIOMS.filter(([en]) => !used.has(en)).slice(0, 3);
    r.idioms = fresh.map(([en, cs]) => ({id: rid('i'), en, cs, pron:'', due:0, interval:0, ease:2.5, reps:0, lapses:0}));
    if (r.idioms.length) saveRoom(r);
  }
  if (!r.idioms.length) return finishLesson();
  Object.assign(L, {stage:'intro', kind:'idioms', list: r.idioms.map(p => p.id), i:0, rep:0});
}

function finishLesson(){
  const r = lessonRoom(); if (!r) return go('today');
  for (const w of items(r)) applyGrade(w, L.errors[w.id] ? 1 : 2);
  r.done = true; saveRoom(r);
  const t = today();
  if (S.meta.streakDate !== t){ S.meta.streak = streak() + 1; S.meta.streakDate = t; saveMeta(); }
  L.stage = 'done'; renderLesson(); window.scrollTo(0,0);
}

function lessonAct(k, el){
  const r = lessonRoom(); if (!r) return go('today');
  if (k === 'listen'){                                   // 3× poslech + zopakuj nahlas
    const w = cur(); if (!w) return;
    // u slova: nejdřív slovo, pak celá věta s ním
    if (L.kind === 'words' && w.sen) sayMany([w.en, w.sen]); else say(w.en);
    L.rep = Math.min(3, L.rep + 1); renderLesson();
  } else if (k === 'next'){
    L.i++; L.rep = 0;
    if (L.i >= L.list.length){
      if (L.kind === 'words') startCards(L.list, 'test', true);
      else startCards(L.list, 'finish', false);
    }
    renderLesson(); window.scrollTo(0,0);
  } else if (k === 'flip'){
    L.flipped = true; renderLesson();
    const it = L.deck[L.di]; const w = it && findWord(it.r, it.w);
    if (w) (gap(w) && !isPhraseLike(it.r, w)) ? say(w.sen) : say(w.en);
  } else if (k === 'sayc'){
    const it = L.deck[L.di]; const w = it && findWord(it.r, it.w);
    if (w) (gap(w) && !isPhraseLike(it.r, w)) ? say(w.sen) : say(w.en);
  } else if (k === 'know' || k === 'miss'){
    const it = L.deck[L.di]; const w = it && findWord(it.r, it.w);
    const ok = k === 'know';
    if (w){
      if (!ok){ L.roundErr.push(it); if (!it.old) L.errors[w.id] = (L.errors[w.id]||0) + 1; }
      if (it.old && !L.oldGraded[w.id]){ L.oldGraded[w.id] = 1; applyGrade(w, ok ? 2 : 0); saveRoom(findRoom(it.r)); }
    }
    L.di++; L.flipped = false;
    if (L.di >= L.deck.length){
      if (!L.roundErr.length){
        if (L.after === 'test') startTest(L.testIds || r.words.map(w => w.id));
        else return finishLesson();
      } else { L.deck = shuffle(L.roundErr); L.roundErr = []; L.di = 0; L.round++; }
    }
    renderLesson(); window.scrollTo(0,0);
  } else if (k === 'show'){
    L.shown = true; renderLesson(); const w = cur(); if (w) say(w.en);
  } else if (k === 'tok' || k === 'tbad'){
    const w = cur();
    if (w){ if (k === 'tok') L.passed[w.id] = 1; else { L.testErr.push(w.id); L.errors[w.id] = (L.errors[w.id]||0) + 1; } }
    L.i++; L.shown = false;
    if (L.i >= L.list.length){
      if (!L.testErr.length) L.stage = 'testok';
      else { L.testIds = L.testErr.slice(); startCards(L.testErr, 'test', false); L.stage = 'testbad'; }
    }
    renderLesson(); window.scrollTo(0,0);
  } else if (k === 'tocards'){ L.stage = 'cards'; renderLesson(); }
  else if (k === 'totiles'){
    ensurePhrases().then(ok => {
      if (ok){ startTiles(r.phrases.map(p => p.id)); }
      else startIdioms();
      renderLesson(); window.scrollTo(0,0);
    });
  }
  else if (k === 'pick'){ const n = Number(el.dataset.n); const o = L.pool.splice(n, 1)[0]; if (o) L.picked.push(o); renderLesson(); }
  else if (k === 'unpick'){ const n = Number(el.dataset.n); const o = L.picked.splice(n, 1)[0]; if (o) L.pool.push(o); renderLesson(); }
  else if (k === 'check'){
    const p = findWord(r.id, L.tdeck[L.ti]);
    const norm = s => s.toLowerCase().replace(/[^a-z']/g, '');
    const ok = L.picked.map(o => norm(o.x)).join(' ') === tokens(p.en).map(norm).join(' ');
    L.checked = ok ? 'ok' : 'bad';
    if (!ok){ L.terr.push(p.id); L.errors[p.id] = (L.errors[p.id]||0) + 1; }
    say(p.en); renderLesson();
  } else if (k === 'tnext'){
    L.ti++;
    if (L.ti >= L.tdeck.length){
      if (!L.terr.length){ startIdioms(); renderLesson(); window.scrollTo(0,0); return; }
      L.tdeck = shuffle(L.terr); L.terr = []; L.ti = 0; L.tround++;
    }
    prepTile(); renderLesson(); window.scrollTo(0,0);
  } else if (k === 'sayp'){ const p = findWord(r.id, L.tdeck[L.ti]); if (p) say(p.en); }
  else if (k === 'nextlesson'){ const n = nextLessonRoom(); if (n) startLesson(n.id); else go('today'); }
}

function stepsBar(){
  const map = {intro: L.kind === 'idioms' ? 'idioms' : L.kind === 'phrases' ? 'tiles' : 'intro',
    cards: L.kind === 'idioms' ? 'idioms' : 'cards', testbad:'test', testok:'test', test:'test', tiles:'tiles', done:'idioms'};
  const idx = STEPS.findIndex(s => s[0] === map[L.stage]);
  const doneAll = L.stage === 'done';
  return `<div class="row" style="gap:4px;margin:-6px 0 14px">${STEPS.map((s,i) =>
    `<div style="text-align:center;font-size:11px;color:${i<=idx?'var(--ink)':'var(--mute)'}"><div style="height:4px;border-radius:2px;margin-bottom:4px;background:${i<idx||doneAll?'var(--good)':i===idx?'var(--accent)':'var(--line)'}"></div>${s[1]}</div>`).join('')}</div>`;
}

function photoWith(r, opts){
  const labels = r.words.map(w => {
    const isCur = opts.cur === w.id;
    if (opts.test){
      if (isCur && !opts.shown) return `<div class="marker" style="left:${w.x*100}%;top:${w.y*100}%"></div>`;
      if (isCur) return `<div class="label dragging" style="left:${w.x*100}%;top:${w.y*100}%">${esc(w.en)}</div>`;
      if (opts.passed && opts.passed[w.id]) return `<div class="label" style="left:${w.x*100}%;top:${w.y*100}%;background:rgba(51,194,122,.92)">${esc(w.en)}</div>`;
      return `<div class="label" style="left:${w.x*100}%;top:${w.y*100}%;opacity:.55">?</div>`;
    }
    if (opts.cur && !isCur) return `<div class="dot" style="left:${w.x*100}%;top:${w.y*100}%"></div>`;
    return `<div class="label ${isCur ? 'dragging' : ''}" style="left:${w.x*100}%;top:${w.y*100}%">${esc(w.en)}</div>`;
  }).join('');
  return `<div class="photo" ${pstyle(r, opts.dim ? 30 : 46)}><img src="${r.img}" alt="" ${opts.dim ? 'style="opacity:.3"' : ''}>${opts.noLabels ? '' : labels}</div>`;
}

function renderLesson(){
  const r = lessonRoom(); if (!r || !L) return go('today');
  const head = `<header><button class="back" data-act="home">←</button><h1>${esc(r.name)}</h1></header>` + stepsBar();
  const st = L.stage;

  if (st === 'intro'){
    const w = cur(); if (!w) return lessonAct('next');
    const kind = L.kind;
    const g = kind === 'words' ? gap(w) : null;
    const title = kind === 'idioms' ? 'Fráze dne' : kind === 'phrases' ? 'Věta' : 'Slovo';
    $app.innerHTML = head + (kind === 'words' ? photoWith(r, {cur: w.id, all:true}) : photoWith(r, {dim:true, noLabels:true})) + `
      <p class="mute" style="margin:12px 0 0">${title} ${L.i+1} z ${L.list.length}</p>
      ${kind === 'idioms' && L.i === 0 ? '<p class="mute" style="margin:2px 0 0">Krátké fráze, které rodilí mluvčí říkají pořád. Hodí se skoro v každém rozhovoru.</p>' : ''}
      <div class="answer"><span style="flex:1">${esc(w.en)}</span></div>
      ${w.pron ? `<div style="font-size:18px">[${esc(w.pron)}]</div>` : ''}
      <div style="font-size:20px;margin-top:2px">${esc(w.cs)}</div>
      ${g ? `<div class="note" style="margin-top:14px"><div class="mute" style="font-size:13px">Ve větě:</div>
              <div style="font-size:19px">${esc(g.before)}<b style="color:var(--accent2)">${esc(g.word)}</b>${esc(g.after)}</div>
              <div class="mute">${esc(w.scs)}</div></div>`
          : kind === 'words' && w.sen ? `<div class="sent">${esc(w.sen)}</div><div class="mute">${esc(w.scs)}</div>` : ''}
      <p class="hint">Poslechni${g ? ' slovo i větu' : ''} a pokaždé to nahlas zopakuj. ${'●'.repeat(L.rep)}${'○'.repeat(3-L.rep)}</p>
      ${L.rep < 3
        ? `<button class="btn" data-act="L:listen">🔊 Poslechnout a zopakovat (${L.rep+1}/3)</button>`
        : `<button class="btn" data-act="L:next">${L.i+1 < L.list.length ? 'Další →' : 'Hotovo, jdeme dál →'}</button>
           <button class="btn ghost small" data-act="L:listen">🔊 Ještě jednou</button>`}`;
    return;
  }

  if (st === 'testbad'){
    $app.innerHTML = head + `<div class="note"><b>${L.testIds.length} ${L.testIds.length === 1 ? 'slovo ti ještě nejde' : 'slova ti ještě nejdou'}.</b><br>
      <span class="mute">Procvičíme je ve větách, dokud nebudou bez chyby, a pak je zkusíme znovu v pokoji.</span></div>
      <button class="btn" data-act="L:tocards">Pokračovat →</button>`;
    return;
  }

  if (st === 'cards'){
    const it = L.deck[L.di]; const w = it && findWord(it.r, it.w);
    if (!w){ L.di++; return renderLesson(); }
    const ph = isPhraseLike(it.r, w);
    const g = ph ? null : gap(w);
    let front, back;
    if (g){
      front = `<div class="mute" style="font-size:13px">Doplň slovo do věty a řekni celou větu nahlas</div>
        <div style="font-size:21px;font-weight:650;margin:10px 0">${esc(g.before)}<span style="display:inline-block;min-width:70px;border-bottom:2px solid var(--accent2)">&nbsp;</span>${esc(g.after)}</div>
        <div class="mute">(${esc(w.cs)}) · ${esc(w.scs)}</div>`;
      back = `<div style="font-size:21px;font-weight:700" data-act="L:sayc">${esc(g.before)}<b style="color:var(--blue)">${esc(g.word)}</b>${esc(g.after)} 🔊</div>
        ${w.pron ? `<div class="mute">${esc(w.en)} [${esc(w.pron)}]</div>` : ''}`;
    } else {
      front = `<div class="mute" style="font-size:13px">Řekni to nahlas anglicky</div>
        <div style="font-size:${ph ? 22 : 30}px;font-weight:750;margin:6px 0">${esc(w.cs)}</div>`;
      back = `<div style="font-size:${ph ? 22 : 30}px;font-weight:800;color:var(--blue)" data-act="L:sayc">${esc(w.en)} 🔊</div>
        ${w.pron ? `<div class="mute">[${esc(w.pron)}]</div>` : ''}`;
    }
    $app.innerHTML = head + `
      <p class="mute" style="margin:0">Kolo ${L.round}${L.round > 1 ? ' · jen to, co nešlo' : ''} · ${L.di+1} z ${L.deck.length}</p>
      <div class="note" style="min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;margin-top:12px">
        ${it.old ? `<div class="mute" style="font-size:12px;margin-bottom:6px">↺ z minulé lekce · ${esc(findRoom(it.r).name)}</div>` : ''}
        ${front}
        ${L.flipped ? `<div style="height:1px;background:var(--line);margin:14px 0"></div>${back}` : ''}
      </div>
      ${L.flipped
        ? `<div class="row" style="margin-top:12px"><button class="grade g0" data-act="L:miss">✗ Nevěděl</button><button class="grade g2" data-act="L:know">✓ Věděl</button></div>`
        : `<button class="btn" data-act="L:flip">Ukázat správně</button>`}`;
    return;
  }

  if (st === 'test'){
    const w = cur(); if (!w) return lessonAct('tok');
    $app.innerHTML = head + photoWith(r, {test:true, cur:w.id, shown:L.shown, passed:L.passed}) + `
      <p class="mute" style="margin:12px 0 0">${L.i+1} z ${L.list.length}</p>
      <h2>Co svítí na fotce? Řekni to nahlas.</h2>
      ${L.shown
        ? `<div class="answer"><span style="flex:1">${esc(w.en)}</span></div><div class="mute">${esc(w.cs)}</div>
           <div class="row" style="margin-top:12px"><button class="grade g0" data-act="L:tbad">✗ Spletl jsem se</button><button class="grade g2" data-act="L:tok">✓ Věděl jsem</button></div>`
        : `<button class="btn" data-act="L:show">Ukázat</button>`}`;
    return;
  }

  if (st === 'testok'){
    $app.innerHTML = head + photoWith(r, {all:true}) + `
      <h2 style="margin-top:14px">Pokoj máš bez chyby 💪</h2>
      <p class="mute">Teď ze slov poskládáš celé věty, co tady běžně děláš. Tak se ze slovíček stane řeč.</p>
      <button class="btn" data-act="L:totiles">Skládat věty →</button>`;
    return;
  }

  if (st === 'tiles'){
    const p = findWord(r.id, L.tdeck[L.ti]); if (!p){ L.ti++; return renderLesson(); }
    const chk = L.checked;
    $app.innerHTML = head + `
      <p class="mute" style="margin:0">Kolo ${L.tround}${L.tround > 1 ? ' · jen to, co nešlo' : ''} · věta ${L.ti+1} z ${L.tdeck.length}</p>
      <h2 style="margin-top:6px">${esc(p.cs)}</h2>
      <p class="mute" style="margin:0">Poskládej anglicky. Ťukni na slova ve správném pořadí.</p>
      <div class="tray ${chk || ''}">${L.picked.length ? L.picked.map((o, n) =>
          `<button class="tile" data-act="L:unpick" data-n="${n}" ${chk ? 'disabled' : ''}>${esc(o.x)}</button>`).join('') : '<span class="mute">…</span>'}</div>
      <div class="pool">${L.pool.map((o, n) => `<button class="tile" data-act="L:pick" data-n="${n}" ${chk ? 'disabled' : ''}>${esc(o.x)}</button>`).join('')}</div>
      ${chk === 'ok' ? `<div class="note" style="border-color:var(--good)"><b style="color:var(--good)">Správně!</b> <span data-act="L:sayp">🔊 ${esc(p.en)}</span><br><span class="mute">Řekni ji ještě jednou nahlas.</span></div>`
        : chk === 'bad' ? `<div class="note" style="border-color:var(--bad)"><b style="color:var(--bad)">Skoro.</b> Správně je:<br><span style="font-size:18px" data-act="L:sayp">🔊 ${esc(p.en)}</span><br><span class="mute">Tahle věta se vrátí na konci kola.</span></div>` : ''}
      ${chk ? `<button class="btn" data-act="L:tnext">Další →</button>`
            : `<button class="btn" data-act="L:check" ${L.pool.length ? 'disabled' : ''}>Zkontrolovat</button>`}`;
    return;
  }

  if (st === 'done'){
    const n = nextLessonRoom();
    const errs = Object.values(L.errors).reduce((a,b)=>a+b, 0);
    const idi = r.idioms || [];
    $app.innerHTML = head + `<div style="text-align:center;padding:18px 0 4px">
      <div style="font-size:60px">🏆</div><h2>Lekce „${esc(r.name)}“ hotová</h2>
      <p class="mute">${r.words.length} slov · ${(r.phrases||[]).length} vět · ${idi.length} fráze · ${errs} ${errs === 1 ? 'chyba' : errs >= 2 && errs <= 4 ? 'chyby' : 'chyb'} cestou</p></div>
      ${idi.length ? `<div class="note"><b>Fráze, které si dneska odnášíš:</b>${idi.map(i => `<div style="margin-top:8px" data-say="${esc(i.en)}">🔊 <b>${esc(i.en)}</b> <span class="mute">– ${esc(i.cs)}</span></div>`).join('')}
        <div class="mute" style="font-size:13px;margin-top:8px">Zkus je dneska aspoň jednou použít, třeba v hlavě při tréninku.</div></div>` : ''}
      <p class="hint" style="margin-top:14px">Všechno se ti teď bude vracet v opakování, přesně když to začneš zapomínat.</p>
      ${n ? `<button class="btn" data-act="L:nextlesson">▶ Další lekce: ${esc(n.name)}</button>`
          : `<button class="btn" data-act="newroom">📷 Vyfotit další místnost</button>`}
      <button class="btn ghost" data-act="home">Zpět na Dnes</button>`;
  }
}

// ---------- kliknutí ----------
$app.addEventListener('click', e => {
  const sy = e.target.closest('[data-say]'); if (sy) return say(sy.dataset.say);
  const g = e.target.closest('[data-g]');
  if (g) return grade(Number(g.dataset.g));
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'home' || act === 'endreview') go('today');
  else if (act === 'rooms') go('rooms', {addMode:false});
  else if (act === 'newroom'){
    if (!S.sample || !S.canImages){ toast('Rozpoznávání fotek tady teď nejde. Otevři appku přes claude.ai a povol Clauda.'); return; }
    newRoomSheet();
  }
  else if (act === 'open') go('room', {roomId: a.dataset.id, hide:false, revealed:null, addMode:false});
  else if (act === 'hide'){ S.hide = !S.hide; S.revealed = null; renderRoom(); }
  else if (act === 'addword'){ S.addMode = !S.addMode; renderRoom(); }
  else if (act === 'delroom') confirmDelete();
  else if (act === 'review') startReview(null);
  else if (act === 'lesson'){ const r = nextLessonRoom(); if (r) startLesson(r.id); }
  else if (act === 'lessonroom') startLesson(S.roomId);
  else if (act.startsWith('L:')) lessonAct(act.slice(2), a);
  else if (act === 'reviewroom') startReview(S.roomId);
  else if (act === 'show'){ S.phase = 'shown'; renderReview(); const it = S.queue[0]; const w = it && findWord(it.r, it.w); if (w) say(w.en); }
  else if (act === 'sayw'){ const it = S.queue[0]; const w = it && findWord(it.r, it.w); if (w) say(w.en); }
  else if (act === 'says'){ const it = S.queue[0]; const w = it && findWord(it.r, it.w); if (w) say(w.sen); }
});

function confirmDelete(){
  const r = findRoom(S.roomId); if (!r) return;
  sheet(`<h2>Smazat „${esc(r.name)}“?</h2><p class="mute">Smaže se fotka i všech ${r.words.length} slov z ní.</p>
    <div class="row"><button class="btn ghost" data-d="no">Ne</button><button class="btn" style="background:var(--bad)" data-d="yes">Smazat</button></div>`);
  $layer.querySelector('.sheet').addEventListener('click', e => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    closeSheet();
    if (b.dataset.d === 'yes'){ S.rooms = S.rooms.filter(x => x.id !== r.id); remove(r.id); go('rooms'); }
  });
}

// ---------- start ----------
(async () => {
  render();
  const [db, user, sample] = await Promise.all([
    claude.use('db'), claude.use('user'), claude.use('sample')
  ]);
  S.db = db; S.sample = sample;
  if (sample){
    try{ const lim = await sample.limits(); S.canImages = !!(lim && lim.images); }catch(e){ S.canImages = false; }
  }
  S.uid = user ? await user.id() : null;
  if (!db || !S.uid){
    S.loadErr = 'Appka potřebuje, abys byl přihlášený na claude.ai. Otevři ji přes odkaz v Claudovi.';
    render(); return;
  }
  const timer = setTimeout(() => { if (!S.loaded){ S.loadErr = 'Data se nedaří načíst. Zkontroluj připojení.'; render(); } }, 10000);
  db.collection('data/users/' + S.uid).onSnapshot(snap => {
    const rooms = [];
    let meta = {};
    for (const d of snap.docs){
      const v = d.data(); if (!v) continue;
      if (d.id === 'meta') meta = {...v};
      else if (d.id.startsWith('room-')) rooms.push({id: d.id, ...JSON.parse(JSON.stringify(v)), words: (v.words || []).map(w => ({...w}))});
    }
    // první načtení, nebo změna z jiného zařízení
    if (!S.loaded || !snap.metadata.hasPendingWrites){
      S.rooms = rooms; S.meta = meta;
    }
    if (!snap.metadata.fromCache){ clearTimeout(timer); S.loadErr=''; }
    const first = !S.loaded; S.loaded = true;
    // během zkoušení a tažení štítků nepřekreslujeme, ať to neskáče
    if (first || S.view === 'today' || S.view === 'rooms') render();
  }, err => {
    clearTimeout(timer);
    S.loadErr = 'Data se nepodařilo načíst (' + (err && err.code) + ').'; render();
  });
})();
</script>
</body>
